# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트를 자동 정지시킨다.
# 정지되면 신청 폼 INSERT가 502로 실패하고, 웹훅→Apps Script 메일도 나가지 않는다.
# 하루 한 번 REST API를 찔러 정지를 막는다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST
  workflow_dispatch:       # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          # 사이트 JS에 이미 공개돼 있는 publishable 키. RLS로 INSERT만 허용된다.
          SUPABASE_URL: https://jwzzwrviltrewriorxzt.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_LAMgK1wCpOjP1H9bfp4R2A_UZvhizoq
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/season2_applications?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          case "$code" in
            2*|4*) echo "살아있음";;
            *)     echo "::error::Supabase 응답 $code — 프로젝트가 정지됐을 수 있습니다"; exit 1;;
          esac
